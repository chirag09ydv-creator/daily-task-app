<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070d16"><title>Daily Tasks</title>
<style>
:root{--bg:#070d16;--card:#111b29;--card2:#172335;--text:#f4f7fb;--muted:#91a0b5;--accent:#6c63ff;--green:#28d99a;--red:#ff4d73;--yellow:#ffc83d;--blue:#52a7ff}
*{box-sizing:border-box}body{margin:0;background:#050a11;color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}.app{max-width:480px;margin:auto;min-height:100vh;background:linear-gradient(180deg,#08101b,#050a11);padding-bottom:90px}.top{padding:26px 20px 12px;display:flex;justify-content:space-between;align-items:center}.hello{font-size:25px;font-weight:750}.sub{color:var(--muted);font-size:13px;margin-top:5px}.sun{font-size:30px}.progress{margin:10px 16px 20px;padding:18px;background:linear-gradient(145deg,#111d2d,#0c1522);border:1px solid #243247;border-radius:18px;display:flex;align-items:center;gap:16px}.ring{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--green) var(--p),#273649 0);position:relative}.ring:after{content:'';position:absolute;inset:7px;border-radius:50%;background:#0d1724}.ring b{position:relative;z-index:1}.progtext{flex:1}.progtext b{font-size:16px}.bar{height:7px;background:#273649;border-radius:99px;margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green);width:0;border-radius:99px}.section{padding:0 16px}.date{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 12px}.date h2{font-size:18px;margin:0}.tasks{display:grid;gap:10px}.task{background:var(--card);border:1px solid #223147;border-radius:15px;padding:14px;display:flex;gap:12px;align-items:center}.check{width:22px;height:22px;border-radius:7px;border:2px solid #63748b;flex:none;display:grid;place-items:center;cursor:pointer}.task.done .check{background:var(--green);border-color:var(--green);color:#06120d}.task.done .title{text-decoration:line-through;color:#7f8da1}.info{min-width:0;flex:1}.title{font-weight:650}.meta{font-size:12px;color:var(--muted);margin-top:4px}.pill{font-size:10px;font-weight:750;padding:5px 8px;border-radius:99px}.high{background:#ff426b;color:#22040c}.medium{background:#ffc72f;color:#241900}.low{background:#398fe7;color:#031326}.empty{text-align:center;color:var(--muted);padding:35px}.fab{position:fixed;right:max(22px,calc(50% - 216px));bottom:78px;width:56px;height:56px;border:0;border-radius:50%;background:var(--accent);color:white;font-size:30px;box-shadow:0 10px 25px #0008;cursor:pointer}.nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:auto;height:66px;background:#0b1320ee;backdrop-filter:blur(12px);border-top:1px solid #1f2d41;display:flex;justify-content:space-around}.nav button{background:none;border:0;color:#8190a4;font-size:11px}.nav button.active{color:#8d86ff}.nav span{display:block;font-size:21px;margin-bottom:3px}.modal{display:none;position:fixed;inset:0;background:#0009;align-items:flex-end;justify-content:center}.modal.show{display:flex}.sheet{width:min(480px,100%);background:#0d1724;border:1px solid #26364d;border-radius:24px 24px 0 0;padding:20px}.sheet h2{margin:0 0 16px}.input{width:100%;padding:14px;border-radius:12px;border:1px solid #2a3a51;background:#142031;color:white;margin-bottom:11px;font-size:15px}.row{display:flex;gap:8px}.priority{flex:1;padding:11px;border-radius:12px;border:1px solid #33455d;background:#142031;color:#cbd5e1}.priority.sel{border-color:var(--accent);background:#25224e}.add{width:100%;padding:14px;border:0;border-radius:13px;background:var(--accent);color:white;font-weight:750;font-size:15px;margin-top:12px}.cancel{width:100%;padding:12px;border:0;background:none;color:#9aa8ba;margin-top:4px}.toast{position:fixed;left:50%;bottom:145px;transform:translateX(-50%);background:#1c2a3c;padding:10px 15px;border-radius:12px;display:none;font-size:13px}
</style></head><body>
<div class="app"><header class="top"><div><div class="hello">Good Morning 👋</div><div class="sub" id="todayLabel"></div></div><div class="sun">☀️</div></header>
<section class="progress"><div class="ring" id="ring"><b id="pct">0%</b></div><div class="progtext"><b>Today's Progress</b><div class="sub" id="count">0 of 0 tasks</div><div class="bar"><i id="bar"></i></div></div></section>
<section class="section"><div class="date"><h2>Today's Tasks</h2><span class="sub" id="dateText"></span></div><div class="tasks" id="tasks"></div></section>
<button class="fab" onclick="openModal()">+</button><nav class="nav"><button class="active"><span>⌂</span>Today</button><button onclick="toast('Calendar coming next')"><span>▣</span>Calendar</button><button onclick="showCompleted()"><span>✓</span>Completed</button><button onclick="toast('Settings coming next')"><span>⋯</span>More</button></nav></div>
<div class="modal" id="modal"><div class="sheet"><h2>Add Task</h2><input class="input" id="title" placeholder="Task title, e.g. Study Physics"><input class="input" id="time" placeholder="Time (optional), e.g. 7:00 AM - 9:00 AM"><div class="row"><button class="priority sel" data-p="High" onclick="pick(this)">High</button><button class="priority" data-p="Medium" onclick="pick(this)">Medium</button><button class="priority" data-p="Low" onclick="pick(this)">Low</button></div><button class="add" onclick="addTask()">Add Task</button><button class="cancel" onclick="closeModal()">Cancel</button></div></div><div class="toast" id="toast"></div>
<script>
const key='dailyTasksV1';let tasks=JSON.parse(localStorage.getItem(key)||'[]');let priority='High';
const fmt=d=>d.toLocaleDateString(undefined,{day:'2-digit',month:'short',year:'numeric'});const today=new Date().toISOString().slice(0,10);
function save(){localStorage.setItem(key,JSON.stringify(tasks))}function render(){let todayTasks=tasks.filter(t=>t.date===today);let done=todayTasks.filter(t=>t.done).length;let pct=todayTasks.length?Math.round(done/todayTasks.length*100):0;document.getElementById('pct').textContent=pct+'%';document.getElementById('count').textContent=`${done} of ${todayTasks.length} tasks`;document.getElementById('bar').style.width=pct+'%';document.getElementById('ring').style.setProperty('--p',pct+'%');document.getElementById('todayLabel').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});document.getElementById('dateText').textContent=fmt(new Date());let el=document.getElementById('tasks');if(!todayTasks.length){el.innerHTML='<div class="empty">No tasks yet.<br>Add your first task with +</div>';return}el.innerHTML=todayTasks.map(t=>`<div class="task ${t.done?'done':''}"><div class="check" onclick="toggle('${t.id}')">${t.done?'✓':''}</div><div class="info"><div class="title">${esc(t.title)}</div><div class="meta">${esc(t.time||'No time set')}</div></div><span class="pill ${t.priority.toLowerCase()}">${t.priority}</span></div>`).join('')}
function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function toggle(id){let t=tasks.find(x=>x.id===id);t.done=!t.done;save();render();toast(t.done?'Task completed ✓':'Task reopened')}function openModal(){document.getElementById('modal').classList.add('show');document.getElementById('title').focus()}function closeModal(){document.getElementById('modal').classList.remove('show');document.getElementById('title').value='';document.getElementById('time').value=''}function pick(b){document.querySelectorAll('.priority').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');priority=b.dataset.p}function addTask(){let title=document.getElementById('title').value.trim();if(!title){toast('Enter a task title');return}tasks.unshift({id:Date.now().toString(),title,time:document.getElementById('time').value.trim(),priority,date:today,done:false});save();closeModal();render();toast('Task added ✓')}function toast(msg){let x=document.getElementById('toast');x.textContent=msg;x.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>x.style.display='none',1800)}function showCompleted(){let n=tasks.filter(t=>t.date===today&&t.done).length;toast(`${n} task${n===1?'':'s'} completed today`)}render();
</script></body></html>
